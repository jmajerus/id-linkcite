# Text for the Dehumanization Patterns overview (https://id.linkcite.org/dehumanization/patterns/scheme).
# Paragraphs are separated by blank lines. Everything else on the page comes from the data.

title = "Dehumanization Patterns"
tagline = "Recurring ways people come to be treated as less than people, and the practices that interrupt them."

intro = """
This is the pattern catalog from *The Struggle Against Dehumanization*. Each entry names a recurring configuration
that shows up across technical systems, institutions and everyday workflows, often without anyone intending harm.

**Anti-patterns** are the ways dehumanization is produced, amplified or made routine: a choice designed to trap,
a feed that rewards outrage, a procedure that quietly takes the place of judgment. **Restorative patterns** are the
practices that interrupt them and help re-anchor a system in human purpose.

Giving these patterns names makes them easier to notice, discuss and resist.
"""

reading_title = "How to read the catalog"
reading = """
Patterns describe; they don't diagnose. Recognizing one tells you what is happening, not why, who is to blame,
or what should be done. Treat the catalog as a set of lenses and a shared vocabulary, not a checklist.

The book reads each pattern alongside the [Dehumanization Frameworks](/dehumanization/frameworks/scheme), which explain the
conditions under which these patterns take hold.
"""

anti_intro = "Grouped as in Annex 2 of the book. Where a restorative pattern answers one, it is listed beneath it."
restorative_intro = "Practices that interrupt dehumanization, restoring recognition, agency and judgment."

proposed_title = "Proposed"
proposed = "Candidates under review, not yet part of the published catalog."

[[sections]]
collection = "section-predatory-choice-architecture"
numeral = "I"
blurb = "Designs that deliberately manipulate choice, consent or the ability to leave."
# Markdown. The inclusion rule shown after it comes from the catalog (the domain's inclusion rule).
note = """
Many are familiar as "dark patterns". They belong in this catalog not because they deceive, but because they treat
the person as an object to be manipulated rather than a subject to be respected. Each can seem minor; built into
systems, they make that stance ordinary and apply it at scale.

Six of the seven have counterparts in the catalog of deceptive patterns maintained by Harry Brignull and Mark Leiser
at [deceptive.design](https://www.deceptive.design/); each pattern's page links to its counterpart.
"""

